[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testsmith"
version = "0.1.0"
description = "A coding agent that writes, runs and repairs pytest tests with NVIDIA Nemotron on Nebius Token Factory, and reports the real bugs they expose."
readme = "README.md"
license = "MIT"
authors = [{ name = "Joshua Yeung" }]
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "coverage>=7.4", "pytest>=8"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.scripts]
testsmith = "testsmith.cli:main"

[tool.setuptools]
packages = ["testsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
